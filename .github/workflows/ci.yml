name: portable-smoke

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  smoke:
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked test dependencies
        run: 'python -m pip install --only-binary=:all: --no-cache-dir -r skills/reverse-engineer-ai-video-tutorial/requirements.lock'
      - name: Run network-free smoke suite
        run: python -m unittest discover -s tests -v
      - name: Validate package entry points
        run: python skills/reverse-engineer-ai-video-tutorial/scripts/install_skill.py --source . --dry-run --json
      - name: Validate stdlib-only doctor
        run: python -S skills/reverse-engineer-ai-video-tutorial/scripts/run.py doctor --profile base --allow-missing --json
      - name: Check managed runtime plan
        run: python skills/reverse-engineer-ai-video-tutorial/scripts/bootstrap_runtime.py --plan --json
      - name: Check managed runtime repair
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TUTORIAL_RE_DATA_ROOT = Join-Path $env:RUNNER_TEMP "tutorial-re-runtime"
          python skills/reverse-engineer-ai-video-tutorial/scripts/bootstrap_runtime.py --repair --json
          python skills/reverse-engineer-ai-video-tutorial/scripts/bootstrap_runtime.py --check --json
      - name: Exercise installer transaction
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $skills = Join-Path $env:RUNNER_TEMP "tutorial-re-skills"
          $target = Join-Path $skills "reverse-engineer-ai-video-tutorial"
          python skills/reverse-engineer-ai-video-tutorial/scripts/install_skill.py --source . --skills-root $skills --target $target --json
          python skills/reverse-engineer-ai-video-tutorial/scripts/install_skill.py --source . --skills-root $skills --target $target --force --json
          python skills/reverse-engineer-ai-video-tutorial/scripts/install_skill.py --source . --skills-root $skills --target $target --rollback --json
          python skills/reverse-engineer-ai-video-tutorial/scripts/install_skill.py --source . --skills-root $skills --target $target --verify --json
      - name: Validate POSIX wrappers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for wrapper in \
            skills/reverse-engineer-ai-video-tutorial/scripts/install_skill.sh \
            skills/reverse-engineer-ai-video-tutorial/scripts/prepare_remotion.sh \
            skills/reverse-engineer-ai-video-tutorial/scripts/prepare_hyperframes.sh; do
            test -f "$wrapper"
            sh -n "$wrapper"
          done
      - name: Prepare shared Remotion toolchain and lean project
        if: matrix.python == '3.11'
        run: python skills/reverse-engineer-ai-video-tutorial/scripts/prepare_remotion.py --source-id ci-smoke --setup-shared
      - name: Validate Remotion compositions
        if: matrix.python == '3.11'
        working-directory: videos/ci-smoke/remotion
        run: npm run compositions
      - name: Validate Remotion project
        if: matrix.python == '3.11'
        working-directory: videos/ci-smoke/remotion
        run: npm run typecheck
